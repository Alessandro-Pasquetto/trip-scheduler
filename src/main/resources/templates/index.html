<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Trip Scheduler</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fa;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background: #1e2a38;
            color: white;
        }

        .navbar .logo {
            font-weight: bold;
            font-size: 18px;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            background: #4a90e2;
            padding: 8px 14px;
            border-radius: 6px;
        }

        .hero {
            text-align: center;
            padding: 80px 20px;
        }

        .hero img {
            width: 180px;
            margin-bottom: 20px;
        }

        .hero h1 {
            font-size: 36px;
            margin-bottom: 10px;
        }

        .hero p {
            color: #555;
            font-size: 18px;
        }

        .cta {
            margin-top: 40px;
        }

        .cta a {
            display: inline-block;
            padding: 15px 30px;
            background: #28a745;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 18px;
        }

        .cta a:hover {
            background: #218838;
        }
    </style>
</head>

<body>
    <div class="navbar">
        <div class="logo">Trip Scheduler</div>
        <a href="/login">Login</a>
    </div>

    <div class="hero">
        <img src="https://cdn-icons-png.flaticon.com/512/201/201623.png" alt="travel">

        <h1>Trip Scheduler</h1>

        <p>Plan your journey hour by hour, including transport, activities, and timing</p>

        <div class="cta">
            <a href="/dashboard">Continue as guest</a>
        </div>
    </div>
</body>
</html>
