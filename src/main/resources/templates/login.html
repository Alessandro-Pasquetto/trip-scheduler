<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:#0f172a;
            color:white;
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .card{
            width:100%;
            max-width:400px;
            background:#1e293b;
            padding:35px;
            border-radius:14px;
            box-shadow:0 0 20px rgba(0,0,0,.3);
        }

        h1{
            text-align:center;
            margin-bottom:25px;
            font-size:30px;
        }

        label{
            display:block;
            margin-top:18px;
            margin-bottom:6px;
        }

        input{
            width:100%;
            padding:12px;
            border:none;
            border-radius:8px;
            font-size:15px;
        }

        button{
            width:100%;
            margin-top:28px;
            padding:12px;
            border:none;
            border-radius:8px;
            background:#f59e0b;
            color:black;
            font-size:16px;
            cursor:pointer;
            font-weight:bold;
        }

        button:hover{
            background:#fb923c;
        }

        .footer{
            margin-top:22px;
            text-align:center;
            font-size:14px;
        }

        .footer a{
            color:#f59e0b;
            text-decoration:none;
        }

        .footer a:hover{
            text-decoration:underline;
        }

        .error{
            margin-top:18px;
            color:#ef4444;
            text-align:center;
            display:none;
        }
    </style>
</head>

<body>
<div class="card">
    <h1>Login</h1>
    <form id="loginForm">
        <label for="nickname">Nickname</label>
        <input type="text" id="nickname" placeholder="Enter your nickname" required>

        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter your password" required>

        <button type="submit">Login</button>

        <div class="error" id="errorMessage">Invalid nickname or password.</div>
    </form>

    <div class="footer">
        Don't have an account?
        <a href="register.html">Create one</a>
    </div>
</div>

<script>
    document.getElementById("loginForm").addEventListener("submit", async function(e){
        e.preventDefault();

        const nickname = document.getElementById("nickname").value;
        const password = document.getElementById("password").value;

        // TODO:
        // POST /api/login
    });

</script>

</body>
</html>
