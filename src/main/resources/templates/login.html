<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #0f172a;
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            width: 100%;
            max-width: 400px;
            background: #1e293b;
            padding: 35px;
            border-radius: 14px;
            box-shadow: 0 0 20px rgba(0, 0, 0, .3);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
            font-size: 30px;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
        }

        button {
            width: 100%;
            margin-top: 28px;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #f59e0b;
            color: black;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #fb923c;
        }

        .footer {
            margin-top: 22px;
            text-align: center;
            font-size: 14px;
        }

        .footer a {
            color: #f59e0b;
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        .error {
            margin-bottom: 18px;
            padding: 12px;
            border-radius: 8px;
            background: #7f1d1d;
            color: #fecaca;
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="card">
        <h1>Login</h1>

        <form method="post" th:action="@{/login}">
            <div th:if="${param.error}" class="error" id="errorMessage">Invalid username or password</div>

            <label for="username">Username</label>
            <input type="text" id="username" name="username" placeholder="Enter your username" required>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Enter your password" required>

            <button type="submit">Login</button>
        </form>

        <div class="footer">
            Don't have an account?
            <a href="/register">Create one</a>
        </div>
    </div>
</body>
</html>
