<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #0f172a;
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            width: 100%;
            max-width: 400px;
            background: #1e293b;
            padding: 35px;
            border-radius: 14px;
            box-shadow: 0 0 20px rgba(0, 0, 0, .3);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
            font-size: 30px;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
        }

        button {
            width: 100%;
            margin-top: 28px;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #f59e0b;
            color: black;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #fb923c;
        }

        .footer {
            margin-top: 22px;
            text-align: center;
            font-size: 14px;
        }

        .footer a {
            color: #f59e0b;
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        .error {
            display: none;
            margin-bottom: 18px;
            padding: 12px;
            border-radius: 8px;
            background: #7f1d1d;
            color: #fecaca;
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="card">
        <h1>Create Account</h1>

        <form id="registerForm">
            <div class="error" id="errorMessage">Registration failed.</div>

            <label for="username">Username</label>
            <input type="text" id="username" placeholder="Choose a username" required>

            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Choose a password" required>

            <label for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword" placeholder="Repeat your password" required>

            <button type="submit">Create Account</button>
        </form>

        <div class="footer">
            Already have an account?
            <a href="/login">Login</a>
        </div>
    </div>

    <script>
        const errorMessage = document.getElementById("errorMessage");

        document.getElementById("registerForm").addEventListener("submit", async function(e){
            e.preventDefault();

            const username = document.getElementById("username").value.trim();
            const password = document.getElementById("password").value;
            const confirmPassword = document.getElementById("confirmPassword").value;

            if(password !== confirmPassword){
                errorMessage.textContent = "Passwords do not match.";
                errorMessage.style.display = "block";
                return;
            }

            try {
                const response = await fetch("/api/auth/register", {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({
                        username: username,
                        password: password
                    })
                });

                if (!response.ok) {
                    const message = await response.text();
                    errorMessage.textContent = message;
                    errorMessage.style.display = "block";
                    return;
                }

                errorMessage.style.display = "none";
                window.location.href = "/login";

            } catch(error) {
                errorMessage.textContent = error.message;
                errorMessage.style.display = "block";
            }
        });
    </script>
</body>
</html>
