<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Vacation Planner</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">

    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body{
            background: #0f172a;
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #backBtn{
            position: fixed;
            top: 20px;
            left: 20px;

            padding: 10px 18px;

            background: #334155;
            color: white;

            border: none;
            border-radius: 8px;

            cursor: pointer;
            font-size: 16px;
        }

        #backBtn:hover{
            background: #475569;
        }

        .container{
            width: 95%;
            max-width: 900px;
        }

        h1{
            text-align: center;
            margin-bottom: 15px;
            font-size: 34px;
        }

        hr{
            border: none;
            border-top: 1px solid #334155;
            margin-bottom: 25px;
        }

        #calendarView{
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #calendarView.hidden {
            display:  none;
        }

        #calendar{
            display: none;
        }

        #confirmBtn{
            margin-top: 20px;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            background: #f59e0b;
            color: black;
            font-size: 16px;
            cursor: pointer;
        }

        #confirmBtn hover{
            background: #fb923c;
        }

        .hidden{
            display: none;
        }

        .day-bar{
            display: flex;
            gap: 10px;
            overflow-x: auto;
            margin-bottom: 20px;
            padding-bottom: 10px;
        }

        .day-bar button{
            padding: 10px 16px;
            border: none;
            border-radius: 8px;
            background: #334155;
            color: white;
            cursor: pointer;
            white-space: nowrap;
        }

        .day-bar button.active{
            background: #f59e0b;
            color: black;
        }

        .schedule-view{
            margin-top: 20px;
        }

        .schedule-header{
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        #addActivity{
            background: #f59e0b;
            color: black;
            border: none;
            border-radius: 8px;
            padding: 10px 18px;
            cursor: pointer;
        }

        table{
            width: 100%;
            border-collapse: collapse;
            background: #1e293b;
        }

        th{
            background: #334155;
        }

        th, td{
            border: 1px solid #334155;
            padding: 12px;
        }

        .modal{
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .6);
            display: none;
            justify-content: center;
            align-items: center;
        }

        .modal-content{
            width: 350px;
            background: #1e293b;
            padding: 20px;
            border-radius: 12px;
        }

        .modal-content h2{
            margin-bottom: 15px;
        }

        .modal-content label{
            display: block;
            margin-top: 12px;
            margin-bottom: 5px;
        }

        .modal-content input{
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 6px;
        }

        .modal-content button{
            width: 100%;
            margin-top: 18px;
            padding: 10px;
            border: none;
            border-radius: 8px;
            background: #f59e0b;
            cursor: pointer;
        }

        .activityCell{
            position: relative;
            height: 60px;
            overflow: visible;
        }

        .activity{
            position: absolute;
            left: 5px;
            right: 5px;
            background: #f59e0b;
            color: black;
            border-radius: 8px;
            padding: 6px;
            font-size: 14px;
            overflow: hidden;
            z-index: 10;
            min-height: 20px;
        }

    </style>
</head>

<body>
    <button id="backBtn">← Back</button>

    <div class="container">
        <div id="calendarView" class="hidden">
            <h1>Select your vacation dates</h1>
            <hr>
            <input id="calendar">
            <button id="confirmBtn">Confirm</button>
        </div>

        <div class="schedule-view hidden">
            <h1>Dates</h1>
            <div class="day-bar"></div>

            <div class="schedule-header">
                <h2 id="dayTitle"></h2>

                <button id="addActivity">+ Add Activity</button>
            </div>

            <table>
                <thead>
                <tr>
                    <th style="width: 90px">Time</th>
                    <th>Activity</th>
                </tr>
                </thead>

                <tbody id="scheduleBody"></tbody>
            </table>
        </div>
    </div>

    <div class="modal" id="modal">
        <div class="modal-content">
            <h2>Add Activity</h2>

            <label>Activity</label>

            <input type="text" id="activityName" placeholder="Museum">

            <label>Start Time</label>

            <input type="time" id="startTime">

            <label>End Time</label>

            <input type="time" id="endTime">

            <button id="saveActivity">Save Activity</button>
        </div>
    </div>

    <script src="/scripts/auth.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

    <script th:inline="javascript">
        let days = [];
        let currentIndex = 0;

        let tripPlan = {
            id: /*[[${idPlan}]]*/ null,
            name: null,
            startDate: null,
            endDate: null,
            activities: []
        };

        const calendarView = document.getElementById("calendarView");
        const dayBar = document.querySelector(".day-bar");
        const scheduleView = document.querySelector(".schedule-view");
        const dayTitle = document.getElementById("dayTitle");
        const scheduleBody = document.getElementById("scheduleBody");
        const modal = document.getElementById("modal");

        loadTrip();

        document.getElementById("backBtn").onclick = function(){
            savePlan();

            if(tripPlan.id != null)
                window.location.href = "/home";
            else
                window.history.back();
        };

        flatpickr("#calendar", {
            inline: true,
            mode: "range",
            dateFormat: "Y-m-d",

            onChange(selectedDates, dateStr) {
                if (selectedDates.length === 2) {
                    const [startDate, endDate] = dateStr.split(" to ");

                    tripPlan.startDate = startDate;
                    tripPlan.endDate = endDate;
                }
            }
        });

        document.getElementById("confirmBtn").onclick = function(){
            if(!tripPlan.startDate || !tripPlan.endDate){
                alert("Select a date range.");
                return;
            }

            savePlan();

            hideCalendarPlanView();
            showScheduleView();
        };

        document.getElementById("addActivity").onclick = function(){
            document.getElementById("activityName").value = "";
            document.getElementById("startTime").value = "09:00";
            document.getElementById("endTime").value = "10:00";

            modal.style.display = "flex";
        };

        window.onclick = function(e){
            if(e.target === modal){
                modal.style.display = "none";
            }
        };

        document.getElementById("saveActivity").onclick = function(){
            const name = document.getElementById("activityName").value;
            const startTime = document.getElementById("startTime").value;
            const endTime = document.getElementById("endTime").value;

            if(name === ""){
                alert("Insert an activity.");
                return;
            }

            tripPlan.activities.push({
                day : getDateKey(days[currentIndex]),
                name : name,
                startTime : startTime,
                endTime : endTime
            });

            modal.style.display = "none";
            renderSchedule();
        };

        function renderBar(){
            dayBar.innerHTML = "";

            days.forEach((day, index) => {
                const button = document.createElement("button");
                button.textContent = formatDate(day);

                if(index === currentIndex)
                    button.classList.add("active");

                button.onclick = function(){
                    currentIndex = index;

                    renderBar();
                    renderSchedule();
                };

                dayBar.appendChild(button);
            });
        }

        function renderSchedule(){
            dayTitle.textContent = formatDate(days[currentIndex]);
            scheduleBody.innerHTML = "";

            const today = getDateKey(days[currentIndex]);

            for(let hour=0; hour <= 23; hour++){
                const row = document.createElement("tr");
                const time = document.createElement("td");
                const activity = document.createElement("td");

                time.textContent = String(hour).padStart(2, "0") + ":00";

                activity.className = "activityCell";

                row.appendChild(time);
                row.appendChild(activity);
                scheduleBody.appendChild(row);

                const found = tripPlan.activities.filter(x => {
                    return x.day === today && parseInt(x.startTime.split(":")[0]) === hour;
                });

                found.forEach(item=>{
                    const div = document.createElement("div");
                    div.className = "activity";

                    const startParts = item.startTime.split(":");
                    const endParts = item.endTime.split(":");

                    const startMinutes = parseInt(startParts[0]) * 60 + parseInt(startParts[1]);
                    const endMinutes = parseInt(endParts[0]) * 60 + parseInt(endParts[1]);

                    const offset = startMinutes % 60;

                    const duration = endMinutes - startMinutes;

                    // 1 minute = 1px
                    div.style.top = offset + "px";
                    div.style.height = duration + "px";

                    div.innerHTML =
                        "<strong>" + item.name + "</strong><br>" +
                        item.startTime + " - " + item.endTime;

                    activity.appendChild(div);
                });
            }
        }

        function showCalendarView(){
            calendarView.classList.remove("hidden");
        }

        function hideCalendarPlanView(){
            calendarView.classList.add("hidden");
        }

        function showScheduleView(){
            days = getDatesBetween(tripPlan.startDate, tripPlan.endDate);
            renderBar();
            renderSchedule();
            scheduleView.classList.remove("hidden");
        }

        function formatDate(date){
            const months = [
                "Jan", "Feb", "Mar", "Apr", "May", "Jun",
                "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"
            ];

            return date.getDate() + " " + months[date.getMonth()];
        }

        function getDateKey(date){
            return date.toISOString().split("T")[0];
        }

        function getDatesBetween(startDate, endDate) {
            const result = [];

            const current = new Date(startDate);
            const last = new Date(endDate);

            while (current <= last) {
                result.push(new Date(current));
                current.setDate(current.getDate() + 1);
            }

            return result;
        }

        async function savePlan(){
            if(tripPlan.id != null)
                await saveTripToDB();
            else
                localStorage.setItem("tripPlan", JSON.stringify(tripPlan));
        }

        async function loadTrip() {
            if (tripPlan.id != null)
                await loadTripFromDB();
            else {
                const saved = localStorage.getItem("tripPlan");

                if (saved)
                    tripPlan = JSON.parse(saved);
            }

            if (!tripPlan.startDate)
                showCalendarView();
            else
                showScheduleView();
        }

        async function saveTripToDB() {
            try {
                const response = await fetch(`/api/trip-plans/${tripPlan.id}`, {
                    method: "PUT",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(tripPlan)
                });

                if (!response.ok)
                    throw new Error("HTTP " + response.status);

                tripPlan = await response.json();
            } catch (err) {
                console.error("Failed to save trip plan", err);
            }
        }

        async function loadTripFromDB() {
            try {
                const response = await fetch(`/api/trip-plans/${tripPlan.id}`);

                if (!response.ok)
                    throw new Error("HTTP " + response.status);

                tripPlan = await response.json();
            } catch (err) {
                console.error("Failed to load trip plan from DB", err);
                window.location.href = "/home";
            }
        }

    </script>
</body>
</html>
