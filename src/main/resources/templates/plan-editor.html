<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Vacation Planner</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">

    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body{
            background: #0f172a;
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #finishBtn{
            position: fixed;
            top: 20px;
            left: 20px;

            padding: 10px 18px;

            background: #334155;
            color: white;

            border: none;
            border-radius: 8px;

            cursor: pointer;
            font-size: 16px;
        }

        #finishBtn:hover{
            background: #475569;
        }

        #roleBadge {
            position: fixed;
            top: 20px;
            right: 20px;

            padding: 8px 14px;
            border-radius: 20px;

            background: #334155;
            color: white;

            font-size: 14px;
            font-weight: bold;
        }

        .container{
            width: 95%;
            max-width: 900px;
        }

        h1{
            text-align: center;
            margin-bottom: 15px;
            font-size: 34px;
        }

        hr{
            border: none;
            border-top: 1px solid #334155;
            margin-bottom: 25px;
        }

        #calendarView{
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #calendarView.hidden {
            display:  none;
        }

        #confirmBtn{
            margin-top: 20px;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            background: #f59e0b;
            color: black;
            font-size: 16px;
            cursor: pointer;
        }

        #confirmBtn:hover{
            background: #fb923c;
        }

        .hidden{
            display: none;
        }

        .day-bar{
            display: flex;
            gap: 10px;
            overflow-x: auto;
            margin-bottom: 20px;
            padding-bottom: 10px;
        }

        .day-bar button{
            padding: 10px 16px;
            border: none;
            border-radius: 8px;
            background: #334155;
            color: white;
            cursor: pointer;
            white-space: nowrap;
        }

        .day-bar button.active{
            background: #f59e0b;
            color: black;
        }

        .schedule-view{
            margin-top: 20px;
        }

        .schedule-header{
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        #addActivity{
            background: #f59e0b;
            color: black;
            border: none;
            border-radius: 8px;
            padding: 10px 18px;
            cursor: pointer;
        }

        table{
            width: 100%;
            border-collapse: collapse;
            background: #1e293b;
        }

        th{
            background: #334155;
        }

        th, td{
            border: 1px solid #334155;
            padding: 12px;
        }

        .modal{
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .6);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2;
        }

        .modal-content{
            width: 350px;
            background: #1e293b;
            padding: 20px;
            border-radius: 12px;
        }

        .modal-content h2{
            margin-bottom: 15px;
        }

        .modal-content label{
            display: block;
            margin-top: 12px;
            margin-bottom: 5px;
        }

        .modal-content input{
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 6px;
        }

        .modal-content textarea, .modal-content select{
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 6px;
        }

        .modal-content textarea{
            resize: vertical;
            min-height: 80px;
        }

        .modal-content button{
            width: 100%;
            margin-top: 18px;
            padding: 10px;
            border: none;
            border-radius: 8px;
            background: #f59e0b;
            cursor: pointer;
        }

        .activityCell{
            position: relative;
            height: 60px;
            overflow: visible;
        }

        .activity{
            position: absolute;
            left: 5px;
            right: 5px;
            background: #f59e0b;
            color: black;
            border-radius: 8px;
            padding: 6px;
            font-size: 14px;
            overflow: hidden;
            z-index: 1;
            min-height: 20px;
            cursor: pointer;
        }

        .deleteActivity {
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            color: #991b1b;
            user-select: none;
        }

        .activity-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2px;
        }

        .activity-header-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .activity-category {
            font-size: 12px;
            font-weight: bold;
        }

        .deleteActivity:hover {
            color: red;
        }

    </style>
</head>

<body>
    <button id="finishBtn">← Finish</button>
    <div id="roleBadge"></div>

    <div class="container">
        <div id="calendarView" class="hidden">
            <h1>Select your vacation dates</h1>
            <hr>
            <div id="calendar"></div>
            <button id="confirmBtn">Confirm</button>
        </div>

        <div class="schedule-view hidden">
            <h1>Dates</h1>
            <div class="day-bar"></div>

            <div class="schedule-header">
                <h2 id="dayTitle"></h2>

                <button id="addActivity">+ Add Activity</button>
            </div>

            <table>
                <thead>
                <tr>
                    <th style="width: 90px">Time</th>
                    <th>Activity</th>
                </tr>
                </thead>

                <tbody id="scheduleBody"></tbody>
            </table>
        </div>
    </div>

    <div class="modal" id="modal">
        <div class="modal-content">
            <h2 id="modalTitle"></h2>

            <label>Activity</label>
            <input type="text" id="activityName" placeholder="Museum">

            <label>Description</label>
            <textarea id="activityDescription" placeholder="Description"></textarea>

            <label>Category</label>
            <select id="activityCategory">
                <option value="ACTIVITY" selected>Activity</option>
                <option value="TRANSPORT">Transport</option>
                <option value="OTHER">Other</option>
            </select>

            <label>Start Time</label>
            <input type="time" id="activityStartTime">

            <label>End Time</label>
            <input type="time" id="activityEndTime">

            <button id="saveActivity">Save Activity</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

    <script th:inline="javascript">
        let days = [];
        let currentIndex = 0;
        let editingActivity = null;

        let tripPlan = {
            id: /*[[${idPlan}]]*/ null,
            name: null,
            startDate: null,
            endDate: null,
            activities: [],
            tripRole: null
        };

        const calendarView = document.getElementById("calendarView");
        const dayBar = document.querySelector(".day-bar");
        const scheduleView = document.querySelector(".schedule-view");
        const dayTitle = document.getElementById("dayTitle");
        const scheduleBody = document.getElementById("scheduleBody");
        const modal = document.getElementById("modal");

        loadTrip();

        document.getElementById("finishBtn").onclick = async function(){
            await savePlan();

            if(tripPlan.id != null)
                window.location.href = "/home";
            else
                window.history.back();
        };

        flatpickr("#calendar", {
            inline: true,
            mode: "range",
            dateFormat: "Y-m-d",

            onChange(selectedDates, dateStr) {
                if (selectedDates.length === 2) {
                    const [startDate, endDate] = dateStr.split(" to ");

                    tripPlan.startDate = startDate;
                    tripPlan.endDate = endDate;
                }
            }
        });

        document.getElementById("confirmBtn").onclick = async function(){
            if(!tripPlan.startDate || !tripPlan.endDate){
                alert("Select a date range.");
                return;
            }

            await savePlan();

            hideCalendarPlanView();
            showScheduleView();
        };

        document.getElementById("addActivity").onclick = function(){
            editingActivity = null;

            document.getElementById("modalTitle").textContent = "Add Activity";
            document.getElementById("activityName").value = "";
            document.getElementById("activityDescription").value = "";
            document.getElementById("activityStartTime").value = "";
            document.getElementById("activityEndTime").value = "";

            modal.style.display = "flex";
        };

        window.onclick = function(e){
            if(e.target === modal){
                modal.style.display = "none";
            }
        };

        document.getElementById("saveActivity").onclick = function(){
            const name = document.getElementById("activityName").value;
            const startTime = document.getElementById("activityStartTime").value;
            const endTime = document.getElementById("activityEndTime").value;
            const description = document.getElementById("activityDescription").value;
            const category = document.getElementById("activityCategory").value;

            if(name === ""){
                alert("Insert an activity.");
                return;
            }

            if (editingActivity) {
                editingActivity.name = name;
                editingActivity.description = description;
                editingActivity.category = category;
                editingActivity.startTime = startTime;
                editingActivity.endTime = endTime;

                editingActivity = null;
            } else {
                tripPlan.activities.push({
                    day: getDateKey(days[currentIndex]),
                    name: name,
                    startTime: startTime,
                    endTime: endTime,
                    description: description,
                    category: category
                });
            }

            modal.style.display = "none";
            renderSchedule();
        };

        function showRole() {
            const roleBadge = document.getElementById("roleBadge");

            if (!tripPlan.tripRole) {
                roleBadge.style.display = "none";
                return;
            }

            roleBadge.textContent = tripPlan.tripRole;

            switch (tripPlan.tripRole) {
                case "OWNER":
                    roleBadge.style.background = "#f59e0b";
                    roleBadge.style.color = "black";
                    break;

                case "EDITOR":
                    roleBadge.style.background = "#22c55e";
                    break;

                case "VIEWER":
                    roleBadge.style.background = "#64748b";
                    break;
            }
        }

        function renderBar(){
            dayBar.innerHTML = "";

            days.forEach((day, index) => {
                const button = document.createElement("button");
                button.textContent = formatDate(day);

                if(index === currentIndex)
                    button.classList.add("active");

                button.onclick = function(){
                    currentIndex = index;

                    renderBar();
                    renderSchedule();
                };

                dayBar.appendChild(button);
            });
        }

        function renderSchedule(){
            dayTitle.textContent = formatDate(days[currentIndex]);
            scheduleBody.innerHTML = "";

            const today = getDateKey(days[currentIndex]);

            for(let hour=0; hour <= 23; hour++){
                const row = document.createElement("tr");
                const time = document.createElement("td");
                const activity = document.createElement("td");

                time.textContent = String(hour).padStart(2, "0") + ":00";

                activity.className = "activityCell";

                row.appendChild(time);
                row.appendChild(activity);
                scheduleBody.appendChild(row);

                const found = tripPlan.activities.filter(x => {
                    return x.day === today && parseInt(x.startTime.split(":")[0]) === hour;
                });

                found.forEach(item=>{
                    const div = document.createElement("div");
                    div.className = "activity";

                    const startParts = item.startTime.split(":");
                    const endParts = item.endTime.split(":");

                    const startMinutes = parseInt(startParts[0]) * 60 + parseInt(startParts[1]);
                    const endMinutes = parseInt(endParts[0]) * 60 + parseInt(endParts[1]);

                    const offset = startMinutes % 60;

                    const duration = endMinutes - startMinutes;

                    // 1 minute = 1px
                    div.style.top = offset + "px";
                    div.style.height = duration + "px";

                    const deleteBtn = document.createElement("span");
                    deleteBtn.className = "deleteActivity";
                    deleteBtn.textContent = "✕";

                    deleteBtn.onclick = function(e){
                        e.stopPropagation();

                        tripPlan.activities = tripPlan.activities.filter(activity =>
                            !(activity.day === item.day &&
                                activity.name === item.name &&
                                activity.startTime === item.startTime &&
                                activity.endTime === item.endTime)
                        );

                        renderSchedule();
                    };

                    const header = document.createElement("div");
                    header.className = "activity-header";

                    const title = document.createElement("strong");
                    title.textContent = item.name;

                    const headerRight = document.createElement("div");
                    headerRight.className = "activity-header-right";

                    const category = document.createElement("span");
                    category.className = "activity-category";
                    category.textContent = item.category;

                    headerRight.appendChild(category);
                    headerRight.appendChild(deleteBtn);

                    header.appendChild(title);
                    header.appendChild(headerRight);

                    div.appendChild(header);

                    if (item.description && duration >= 45) {
                        const description = document.createElement("small");
                        description.textContent = item.description;

                        div.appendChild(description);
                    }

                    if (duration >= 30) {
                        const time = document.createElement("div");

                        time.textContent =
                            item.startTime.substring(0, 5) +
                            " - " +
                            item.endTime.substring(0, 5);

                        div.appendChild(time);
                    }

                    div.onclick = function () {
                        editingActivity = item;

                        document.getElementById("modalTitle").textContent = "Edit Activity";
                        document.getElementById("activityName").value = item.name;
                        document.getElementById("activityStartTime").value = item.startTime;
                        document.getElementById("activityEndTime").value = item.endTime;
                        document.getElementById("activityDescription").value = item.description;
                        document.getElementById("activityCategory").value = item.category;

                        modal.style.display = "flex";
                    };

                    activity.appendChild(div);
                });
            }
        }

        function showCalendarView(){
            calendarView.classList.remove("hidden");
        }

        function hideCalendarPlanView(){
            calendarView.classList.add("hidden");
        }

        function showScheduleView(){
            days = getDatesBetween(tripPlan.startDate, tripPlan.endDate);
            renderBar();
            renderSchedule();
            scheduleView.classList.remove("hidden");
        }

        function formatDate(date){
            const months = [
                "Jan", "Feb", "Mar", "Apr", "May", "Jun",
                "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"
            ];

            return date.getDate() + " " + months[date.getMonth()];
        }

        function getDateKey(date){
            return date.toISOString().split("T")[0];
        }

        function getDatesBetween(startDate, endDate) {
            const result = [];

            const current = new Date(startDate);
            const last = new Date(endDate);

            while (current <= last) {
                result.push(new Date(current));
                current.setDate(current.getDate() + 1);
            }

            return result;
        }

        async function savePlan(){
            if(tripPlan.id != null)
                await saveTripToDB();
            else
                localStorage.setItem("tripPlan", JSON.stringify(tripPlan));
        }

        async function loadTrip() {
            if (tripPlan.id != null)
                await loadTripFromDB();
            else {
                const saved = localStorage.getItem("tripPlan");

                if (saved)
                    tripPlan = JSON.parse(saved);
            }

            showRole();

            if (!tripPlan.startDate)
                showCalendarView();
            else
                showScheduleView();
        }

        async function saveTripToDB() {
            try {
                const response = await fetch(`/api/trip-plans/${tripPlan.id}`, {
                    method: "PUT",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(tripPlan)
                });

                if (!response.ok)
                    throw new Error("HTTP " + response.status);

                tripPlan = await response.json();
            } catch (err) {
                console.error("Failed to save trip plan", err);
            }
        }

        async function loadTripFromDB() {
            try {
                const response = await fetch(`/api/trip-plans/${tripPlan.id}`);

                if (!response.ok)
                    throw new Error("HTTP " + response.status);

                tripPlan = await response.json();
            } catch (err) {
                console.error("Failed to load trip plan from DB", err);
                window.location.href = "/home";
            }
        }

    </script>
</body>
</html>
